[package]
name = "zink-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver"] }
anyhow.workspace = true
directories.workspace = true
slint.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
rusqlite.workspace = true
lofty.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom = "0.3"
url.workspace = true
zip = { version = "2.4", default-features = false, features = ["deflate"] }
zink-core = { path = "../zink-core" }
zink-data = { path = "../zink-data" }
zink-media = { path = "../zink-media" }
zink-platform-windows = { path = "../zink-platform-windows" }

[target.'cfg(windows)'.dependencies]
tao.workspace = true
wry.workspace = true
raw-window-handle.workspace = true
webview2-com = "0.39.1"
ureq = "3.1.4"
futures-util = "0.3"
base64 = "0.22"
cpal = "0.18.2"
opus-rs = "0.1.41"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tokio = { workspace = true, features = ["net"] }
win-native-media = { path = "../win-native-media" }
windows = { workspace = true, features = ["Data_Xml_Dom", "Foundation", "Media_MediaProperties", "Media_Transcoding", "Services_Store", "Storage", "Storage_FileProperties", "Storage_Streams", "System_UserProfile", "UI_Notifications", "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
webrtc = "=0.21.1"
rtc = "=0.21.1"
async-trait = "0.1"
sansio = "=1.0.1"
rav1d = { version = "=1.1.0", default-features = false, features = ["bitdepth_8"] }
windows-core = "0.62"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[lints]
workspace = true

